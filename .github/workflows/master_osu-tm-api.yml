# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - osu-tm-api

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: index.docker.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_7A810E775F944FE2A176C68FEE66FF99 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_9299226338AD4BC0948BDCEA97D210E2 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: index.docker.io/andy26/otm-api:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'osu-tm-api'
          slot-name: 'Production'
          images: 'index.docker.io/andy26/otm-api:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_488F78CC60334CBDB00E2851573F1D07 }}